services:
  db:
    image: postgis/postgis:16-3.4
    container_name: leopard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: leopard
      POSTGRES_PASSWORD: leopard
      POSTGRES_DB: leopard
    ports:
      - "5432:5432"
    volumes:
      - leopard-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leopard -d leopard"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  leopard-db-data:
