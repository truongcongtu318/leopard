name: leopard

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leopard}
      POSTGRES_USER: ${POSTGRES_USER:-leopard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leopard_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    tmpfs:
      - /var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-leopard}:${POSTGRES_PASSWORD:-leopard_local}@postgres:5432/${POSTGRES_DB:-leopard}?schema=public
      PORT: "3000"
      NODE_ENV: production
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET:?AUTH_ACCESS_TOKEN_SECRET is required}
      AUTH_REFRESH_TOKEN_SECRET: ${AUTH_REFRESH_TOKEN_SECRET:?AUTH_REFRESH_TOKEN_SECRET is required}
      ESTIMATE_TOKEN_HMAC_SECRET: ${ESTIMATE_TOKEN_HMAC_SECRET:?ESTIMATE_TOKEN_HMAC_SECRET is required}
      PRICING_MINIMUM_FARE_VND: ${PRICING_MINIMUM_FARE_VND:?PRICING_MINIMUM_FARE_VND is required}
      PRICING_STOP_SURCHARGE_VND: ${PRICING_STOP_SURCHARGE_VND:?PRICING_STOP_SURCHARGE_VND is required}
      PRICING_VEHICLE_RATES_JSON: ${PRICING_VEHICLE_RATES_JSON:?PRICING_VEHICLE_RATES_JSON is required}
      MAP_PROVIDER: ${MAP_PROVIDER:?MAP_PROVIDER is required}
      ALLOW_DEMO_PROVIDER: ${ALLOW_DEMO_PROVIDER:-false}
      VIETMAP_API_KEY: ${VIETMAP_API_KEY:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?FIREBASE_PROJECT_ID is required}

  admin:
    build:
      context: .
      dockerfile: infra/docker/admin.Dockerfile
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3002}:3002"
    env_file:
      - .env.example
    environment:
      API_URL: http://api:3000/api/v1
