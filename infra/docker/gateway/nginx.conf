upstream api_upstream   { server api:3000; }
upstream admin_upstream { server admin:3002; }

# Routing note
# ------------
# Only the Admin console is served through the gateway, at /login and /admin/.
# Its assets live under /_next/, which is proxied below.
#
# The two Expo Web apps are deliberately NOT proxied through the gateway: their
# exported index.html references its bundle at the absolute path
# /_expo/static/js/web/entry-*.js. Two Expo apps behind one origin would both
# claim /_expo/, and nginx can only map that prefix to one of them. Each app is
# therefore served by its own nginx container at the root of its own port
# (8081 customer, 8082 driver), where /_expo/ resolves correctly. The landing
# portal links straight to those ports.
#
# Each app's own nginx also proxies /api/v1/ and /socket.io/ to the API, so the
# apps can use relative URLs and stay same-origin.

server {
    # 8080, not 80: the image runs as an unprivileged user, which cannot bind a
    # port below 1024. Compose maps the host's port 80 onto this one.
    listen 8080;
    server_name _;
    client_max_body_size 20M;

    # ── Landing portal ──
    location = / {
        root /usr/share/nginx/html;
        index index.html;
    }
    location = /index.html {
        root /usr/share/nginx/html;
    }
    location = /favicon.ico {
        root /usr/share/nginx/html;
        try_files $uri =204;
    }

    # ── Admin console (Next.js, absolute routes + /_next assets) ──
    location /login {
        proxy_pass http://admin_upstream/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://admin_upstream/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/ {
        proxy_pass http://admin_upstream/_next/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin BFF: the browser talks to /api/v1 here and Next.js proxies it to the
    # API server-side, so admin traffic never needs CORS.
    location /api/v1/ {
        proxy_pass http://admin_upstream/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Direct API access (Swagger, integrations) ──
    location /docs {
        proxy_pass http://api_upstream/docs;
        proxy_set_header Host $host;
    }

    # ── WebSocket ──
    location /socket.io/ {
        proxy_pass http://api_upstream/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # ── Locally stored uploads ──
    location /files/ {
        proxy_pass http://api_upstream/files/;
        proxy_set_header Host $host;
    }
}
