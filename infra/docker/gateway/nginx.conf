upstream api_upstream      { server api:3000; }
upstream admin_upstream    { server admin:3002; }
upstream customer_upstream { server customer:8080; }
upstream driver_upstream   { server driver:8080; }

# Routing note
# ------------
# One origin serves everything:
#   /            portal
#   /login, /admin/, /_next/   Admin console (its routes are absolute)
#   /customer/   Customer Expo app
#   /driver/     Driver Expo app
#   /api/v1/, /socket.io/, /files/, /docs   API
#
# The two Expo apps are built with `experiments.baseUrl` set to their prefix, so
# their exported index.html asks for /customer/_expo/... instead of /_expo/...
# That is what makes it possible to put both behind one host: without a prefix
# they would both claim /_expo/ and nginx could only map it to one of them.
#
# The unprefixed locations below exist because Metro emits a few runtime URLs
# without the base path (the HTML document itself, deep links). Each is an exact
# match, so the API prefix is never shadowed.
#
# A single HTTPS origin is not cosmetic: the browser Geolocation API refuses to
# run on an insecure origin, so serving these apps over plain HTTP silently
# breaks every "use my current location" flow.

server {
    # 8080, not 80: the image runs as an unprivileged user, which cannot bind a
    # port below 1024. Compose maps the host's port 80 onto this one.
    listen 8080;
    server_name _;
    client_max_body_size 20M;

    # ── Landing portal ──
    location = / {
        root /usr/share/nginx/html;
        index index.html;
    }
    location = /index.html {
        root /usr/share/nginx/html;
    }
    location = /favicon.ico {
        root /usr/share/nginx/html;
        try_files $uri =204;
    }

    # ── Admin console (Next.js, absolute routes + /_next assets) ──
    location /login {
        proxy_pass http://admin_upstream/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://admin_upstream/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/ {
        proxy_pass http://admin_upstream/_next/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Customer + Driver Expo apps, prefixed ──
    # The trailing slash on proxy_pass strips the prefix: the app container still
    # serves its files from the root, and its own nginx keeps handling /api/v1 and
    # /socket.io. index.html comes back with `no-store` from nginx-expo.conf, so a
    # browser cannot keep running a pre-fix bundle.
    location /customer/ {
        proxy_pass http://customer_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }

    location /driver/ {
        proxy_pass http://driver_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }

    # Metro emits a handful of URLs without the base path — the HTML document, the
    # favicon, and deep links typed or shared without a trailing slash. Each is an
    # exact match, so none of them can shadow /api/v1 or /socket.io.
    location = /customer {
        proxy_pass http://customer_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /driver {
        proxy_pass http://driver_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /metadata.json {
        proxy_pass http://customer_upstream/metadata.json;
    }

    # Admin BFF: the browser talks to /api/v1 here and Next.js proxies it to the
    # API server-side, so admin traffic never needs CORS.
    location /api/v1/ {
        proxy_pass http://admin_upstream/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Direct API access (Swagger, integrations) ──
    location /docs {
        proxy_pass http://api_upstream/docs;
        proxy_set_header Host $host;
    }

    # ── WebSocket ──
    location /socket.io/ {
        proxy_pass http://api_upstream/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # ── Locally stored uploads ──
    location /files/ {
        proxy_pass http://api_upstream/files/;
        proxy_set_header Host $host;
    }
}
