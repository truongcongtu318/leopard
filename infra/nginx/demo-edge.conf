# Edge reverse proxy for a single-origin demo deployment.
#
# Sits in front of the demo stack's host ports and gives every app one origin:
#
#   https://<tunnel-host>/            portal
#   https://<tunnel-host>/login       Admin console
#   https://<tunnel-host>/customer/   Customer app
#   https://<tunnel-host>/driver/     Driver app
#
# One origin is what makes the browser Geolocation API work: it refuses to run
# on an insecure origin, so over plain HTTP every "use my current location"
# flow fails silently. The tunnel terminates TLS and forwards here over
# loopback.
#
# The stack's own ports (80/3000/3002/8081/8082) stay as they are; this listens
# on 8888 and is the only port the tunnel points at.
#
# Install (on the VPS, after ./infra/scripts/deploy-demo.sh has started the
# stack):
#   cp infra/nginx/demo-edge.conf /etc/nginx/conf.d/demo-edge.conf
#   nginx -t && systemctl reload nginx

upstream leopard_api      { server 127.0.0.1:3000; }
upstream leopard_admin    { server 127.0.0.1:3002; }
upstream leopard_customer { server 127.0.0.1:8081; }
upstream leopard_driver   { server 127.0.0.1:8082; }

server {
    listen 8888;
    server_name _;
    client_max_body_size 20M;

    # ── Landing portal ──
    location = / {
        proxy_pass http://127.0.0.1:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Admin console ──
    location = /index.html {
        proxy_pass http://127.0.0.1:80/index.html;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /favicon.ico {
        proxy_pass http://127.0.0.1:80/favicon.ico;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login {
        proxy_pass http://leopard_admin/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://leopard_admin/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/ {
        proxy_pass http://leopard_admin/_next/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Customer + Driver Expo apps ──
    # Trailing slash on proxy_pass strips the prefix; the apps are built with
    # experiments.baseUrl set to it, so their assets are already requested under
    # /customer/_expo/... and must stay prefixed on the way in.
    location /customer/ {
        proxy_pass http://leopard_customer/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }

    location /driver/ {
        proxy_pass http://leopard_driver/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }

    # Unprefixed document URLs Metro emits: the HTML document itself, the
    # favicon and metadata. Exact matches only, so the API prefix is untouched.
    location = /customer {
        proxy_pass http://leopard_customer/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /driver {
        proxy_pass http://leopard_driver/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /metadata.json {
        proxy_pass http://leopard_customer/metadata.json;
        proxy_set_header Host $host;
    }

    # ── API ──
    # The apps call /api/v1 with a relative URL, which resolves against the app
    # origin — this one — so the API has to be reachable at the root.
    location /api/v1/ {
        proxy_pass http://leopard_api/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }

    location /docs {
        proxy_pass http://leopard_api/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /files/ {
        proxy_pass http://leopard_api/files/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://leopard_api/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
