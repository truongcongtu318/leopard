# Edge reverse proxy — portal host only.
#
# The portal host serves two things: the landing page (gateway container on :80)
# and the Admin console, which the gateway already routes at /login, /admin/ and
# /_next/. It exists because the Admin console is a Next.js app whose routes are
# absolute, so it needs an origin of its own.

map $http_x_forwarded_proto $edge_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream leopard_api   { server 127.0.0.1:3000; }
upstream leopard_admin { server 127.0.0.1:3002; }

# ── Portal host: landing page and Admin console ──
server {
    listen 8888;
    server_name _;
    client_max_body_size 20M;
    port_in_redirect off;
    absolute_redirect off;

    location = / {
        proxy_pass http://127.0.0.1:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
    }

    location = /index.html {
        proxy_pass http://127.0.0.1:80/index.html;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
    }

    location = /favicon.ico {
        proxy_pass http://127.0.0.1:80/favicon.ico;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
    }

    location /login {
        proxy_pass http://leopard_admin/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
    }

    location /admin {
        proxy_pass http://leopard_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
    }

    location /_next/ {
        proxy_pass http://leopard_admin/_next/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
    }

    # ── Webhooks (payOS & third-party callbacks) ──
    location /api/v1/payments/webhook/ {
        proxy_pass http://leopard_api/api/v1/payments/webhook/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
    }

    # Admin BFF: the browser calls /api/v1 here and Next.js forwards it to the API.
    location /api/v1/ {
        proxy_pass http://leopard_admin/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
    }

    location /docs {
        proxy_pass http://leopard_api/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
    }
}

# ── Customer and Driver hosts ──
#
# These two are deliberately NOT proxied here: their tunnels point straight at
# the app containers (127.0.0.1:8081 and 127.0.0.1:8082), so each app is served
# at the root of its own host with no path rewriting at all.
#
# A shared host with path prefixes does not work for them. The exported Expo apps
# link their bundle and every route from the root (/_expo/..., /customer/home),
# and Expo Router's `experiments.baseUrl` re-prepends a configured prefix to the
# paths the app already hard-codes — post-login navigation then lands on
# /customer/customer/home and the app renders its own 404 page.
#
# Each app container proxies /api/v1, /files and /socket.io to the API itself, so
# this file only has to handle the portal host above.

